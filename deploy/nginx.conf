# =============================================================================
# Viora Dashboard — nginx site configuration
# =============================================================================
#
# HOW TO INSTALL (multi-site VPS):
#   1. Replace YOUR_HOME in the alias paths below.
#   2. Copy to /etc/nginx/sites-available/viora-dashboard
#   3. sudo ln -sf ../sites-available/viora-dashboard /etc/nginx/sites-enabled/
#   4. sudo nginx -t && sudo systemctl reload nginx
#
# HOW IT WORKS:
#   All sites on this VPS share ports 80/443 on a single nginx instance.
#   Each site has its own file in /etc/nginx/sites-available/.
#   nginx routes requests by server_name — no port conflicts.
#
#   Example layout on a multi-site VPS:
#     /etc/nginx/sites-enabled/
#       viora-dashboard  →  server_name dev.evaka.store  → 127.0.0.1:4179
#       site2            →  server_name site2.com        → 127.0.0.1:4180
#       site3            →  server_name site3.org        → 127.0.0.1:4181
#
#   Each app runs on a unique internal port (4179, 4180, ...).
#   nginx reverse-proxies from 80/443 to the appropriate internal port.
#
# SSL:
#   Uses Let's Encrypt via Certbot. After placing this file, run:
#     certbot --nginx -d dev.evaka.store
#   Certbot auto-updates the ssl_* paths below.
# =============================================================================

upstream viora_app {
    server 127.0.0.1:4179;
    keepalive 64;
}

# ---------------------------------------------------------------------------
# HTTP → HTTPS redirect
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name dev.evaka.store;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# HTTPS — main site
# ---------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dev.evaka.store;

    # --- SSL (auto-managed by Certbot) ---
    ssl_certificate     /etc/letsencrypt/live/dev.evaka.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.evaka.store/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # --- Security headers ---
    add_header X-Frame-Options       "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff"   always;
    add_header X-XSS-Protection      "0"          always;
    add_header Referrer-Policy       "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # --- Gzip ---
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 256;
    gzip_vary on;
    gzip_proxied any;

    # --- Next.js static build assets (fingerprinted → cache forever) ---
    location /_next/static {
        alias YOUR_HOME/viora-dashboard/build-deploy/.next/static;   # ← replace YOUR_HOME
        expires 365d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # --- Public static files (images, fonts, etc.) ---
    location /static {
        alias YOUR_HOME/viora-dashboard/build-deploy/public;           # ← replace YOUR_HOME
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # --- Everything else → Next.js ---
    location / {
        proxy_pass http://viora_app;
        proxy_http_version 1.1;

        # WebSocket support (needed for Next.js HMR / dashboard live updates)
        proxy_set_header Upgrade             $http_upgrade;
        proxy_set_header Connection          "upgrade";

        # Standard proxy headers
        proxy_set_header Host                $host;
        proxy_set_header X-Real-IP           $remote_addr;
        proxy_set_header X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto   $scheme;

        proxy_read_timeout  60s;
        proxy_send_timeout  60s;

        # Disable buffering for lower latency and less memory usage.
        proxy_buffering         off;
        proxy_request_buffering off;
    }

    # --- Access & error logs ---
    access_log /var/log/nginx/viora-dashboard.access.log;
    error_log  /var/log/nginx/viora-dashboard.error.log warn;
}
