# =============================================================================
# Viora Dashboard — minimal nginx config (SSL + proxy, no static aliases)
# =============================================================================
#
# ponytail: single upstream, one site — no extras

upstream viora_app {
    server 127.0.0.1:4179;
    keepalive 64;
}

server {
    listen 80;
    server_name dev.evaka.store;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name dev.evaka.store;

    ssl_certificate     /etc/letsencrypt/live/dev.evaka.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.evaka.store/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Frame-Options       "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff"   always;
    add_header X-XSS-Protection      "0"          always;
    add_header Referrer-Policy       "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 256;
    gzip_vary on;

    location /_next/static {
        alias YOUR_HOME/viora-dashboard/build-deploy/.next/static;   # ← replace YOUR_HOME
        expires 365d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /static {
        alias YOUR_HOME/viora-dashboard/build-deploy/public;           # ← replace YOUR_HOME
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        proxy_pass http://viora_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade        $http_upgrade;
        proxy_set_header Connection     "upgrade";
        proxy_set_header Host           $host;
        proxy_set_header X-Real-IP      $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering off;
    }
}
